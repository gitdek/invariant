{
  "ratified": {
    "by": "gitdek",
    "at": "2026-09-29T00:46:40Z",
    "issue": 91,
    "comment": "https://github.com/gitdek/invariant/issues/91#issuecomment-5881475888",
    "proposal": "sha256:d7eebb8d69540485776e47dc72f394c6a7fb7d5fbdd02aad0a6ec2a7ba8966bb"
  },
  "bounds": {
    "Agents": "{a1}",
    "Checkouts": "{c1, c2}",
    "MaxId": "2",
    "MaxLen": "2",
    "MaxWrites": "3",
    "People": "{p1}"
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "The journal starts empty, and every step is a decide, ratify, supersede or link write, a process finishing or stopping mid-write, a merge, a branch taking main in, or a branch dropping a conflicting ratify.",
      "sha256": "sha256:c2e63f3af9ff30375c95c38b4ddd8bac3a54a23f37546d20b16a3d56a8579391"
    },
    {
      "name": "TypeOK",
      "kind": "invariant",
      "says": "Every checkout and main hold a journal of lines per decision ID, the store holds a sequence of recorded lines, and at most one write is in progress.",
      "sha256": "sha256:97f5ec0683471d0b0444787701ad08235930c4bd555ef848ae0ae306cfc61ca8"
    },
    {
      "name": "UniqueIds",
      "kind": "invariant",
      "says": "No two decisions ever take the same ID, in any checkout, on any branch, merged or not.",
      "sha256": "sha256:ae14f914b1bbd09765b38e574cab9403c2d16a05ce99365ea0ae3bfcd102cd0a"
    },
    {
      "name": "MainKeepsLines",
      "kind": "invariant",
      "says": "Every line main has ever had is still on main, in the same place.",
      "sha256": "sha256:16586917bdcdcdc20fd4d9789cb463708c4f28f4142541a95708f8ff27a62f94"
    },
    {
      "name": "StoreKeepsLines",
      "kind": "invariant",
      "says": "The store's journal only grows: every line it ever recorded is still there, in the same place, including lines from branches that never merged.",
      "sha256": "sha256:7d9c3be2ac88ad4cd4382dc6ef82bb13b744e0ae35ee8a3758897aa3710da7e5"
    },
    {
      "name": "RatifiedByPerson",
      "kind": "invariant",
      "says": "Every ratify line on main names a person.",
      "sha256": "sha256:989771a1cd6363d239cc5a542273f31dab741064b80b545e217f0f3484c5abd8"
    },
    {
      "name": "NoAgentOneWayDoor",
      "kind": "invariant",
      "says": "No one-way door on main was decided by an agent; an agent can only propose one.",
      "sha256": "sha256:83f6622ed20d1f9b53730bdf28686b4e6cb09eaf1383f9f366cd5dbe8526eeca"
    },
    {
      "name": "JournalsWellFormed",
      "kind": "invariant",
      "says": "In every checkout and on main, a journal's first line records its decision, no later line does, and no ratify comes after a ratify or a supersede.",
      "sha256": "sha256:60593c49f5e2c1663c0fa39f28d81a1a76fda3b7eb055cb7e827a4277a39ad08"
    },
    {
      "name": "RatifiedOnMain",
      "kind": "witness",
      "says": "A decision can be ratified and reach main.",
      "sha256": "sha256:23c0b9d401d0af4d1e5d63b0f47cd4cb0ba2be7348b6a1c18b972b4def028918"
    },
    {
      "name": "AgentProposalRatifiedOnMain",
      "kind": "witness",
      "says": "An agent can propose a one-way door and a person can ratify it on main.",
      "sha256": "sha256:49755d560e8d3b844aadd808c347f537cf183c4e593fe581c4694a6f941f980a"
    },
    {
      "name": "SupersededOnMain",
      "kind": "witness",
      "says": "A decision can be superseded on main.",
      "sha256": "sha256:c98a310ed1b212a6abae843ef9f32b81c406586c5ab55a054d8d76fc97497065"
    },
    {
      "name": "BothBranchesOnOneDecision",
      "kind": "witness",
      "says": "Two branches can each add a line to the same decision and both reach main.",
      "sha256": "sha256:bf7909e87fabf80c2b19e77160872e158ff07b4b4a5aa71da8c5adc85c28d5b1"
    },
    {
      "name": "GapInIds",
      "kind": "witness",
      "says": "A process that stops mid-decide can leave a gap in the IDs while a later decision reaches main.",
      "sha256": "sha256:4de765c4e2b232e456a333c90ef0dd32abe41a4d6b984b9ca756d9cb2773e11b"
    },
    {
      "name": "DecideFileFirst",
      "kind": "bug",
      "says": "A decide writes the journal file first and stops before the store records the ID.",
      "expect": "UniqueIds",
      "sha256": "sha256:798c41fdd4449c6fe9cbd87ec701a3e060dbc4c23cfb635ab57b745ae744747f"
    },
    {
      "name": "MergeOverwrite",
      "kind": "bug",
      "says": "A branch merges without checking that main's lines are still in it, in place.",
      "expect": "MainKeepsLines",
      "sha256": "sha256:bf574523810e5df0d35fa43184ae3b79848c545343fdbfae063703785a32872d"
    },
    {
      "name": "AgentRatify",
      "kind": "bug",
      "says": "An agent writes a ratify line.",
      "expect": "RatifiedByPerson",
      "sha256": "sha256:04db8a981ba2406cd68cd3d6f2e9ae0f087e0c2cb18840fa14dc922d275a5883"
    },
    {
      "name": "SyncUnchecked",
      "kind": "bug",
      "says": "A branch takes main in without checking whether that puts a ratify after a ratify or supersede.",
      "expect": "JournalsWellFormed",
      "sha256": "sha256:ef69fc2d4a12b265dbd8d8596aa6488b6b72381c65320911e8f4102b5dbfb125"
    }
  ]
}
