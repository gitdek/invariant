{
  "decision": "D-0202",
  "bounds": {
    "Actors": "{alice, mallory, invbot}",
    "Bots": "{invbot}",
    "Heads": "{h1, h2}",
    "NoActor": "NoActor",
    "NoHead": "NoHead",
    "NoP": "NoP",
    "Proposals": "{p1, p2}",
    "Questions": "{f1, f2}",
    "Writers": "{alice, invbot}"
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "The factory starts with no post on the issue, and every step is a Next step.",
      "sha256": "sha256:1ad1e97165da087a07871554d0a03dcf90bb1f54cad26edd9d5647d288004f0d"
    },
    {
      "name": "TypeOK",
      "kind": "invariant",
      "says": "The issue's state is always one of the ten kinds of post, and everything else the factory knows has its expected type.",
      "sha256": "sha256:ade8b428766cec26abe520e5ad93499676e91ff28173bce06d105b5f7b55581a"
    },
    {
      "name": "OnlyDirectorsDirect",
      "kind": "invariant",
      "says": "Every command the factory acted on came from a person with write access, never from anyone else or from a bot.",
      "sha256": "sha256:0238f6f0b4a1ec8e175e5803f80bf9419f161f2e722e97691ff5e712764a4925"
    },
    {
      "name": "RatifiesCurrentProposal",
      "kind": "invariant",
      "says": "Whenever something is ratified, built or merged, it is the current proposal.",
      "sha256": "sha256:5d3c9184f121258a2e8bd549926d4bb105ea0a810ec298dcb42e4a0cbbc3da7b"
    },
    {
      "name": "NoOpenQuestionsWhenRatified",
      "kind": "invariant",
      "says": "Nothing is ratified while a question is still open.",
      "sha256": "sha256:65a6e5c02b8a56b5c286aafe5caee5a6fe1b274e19efe7969bd51686221204f9"
    },
    {
      "name": "AmendsHeldLock",
      "kind": "invariant",
      "says": "A proposal is ratified only while the base branch holds the lock it amends.",
      "sha256": "sha256:54ee8e8c46536a1e4114c83f8c5c769a290e3bf205b08cad3b8a40ea63995c68"
    },
    {
      "name": "MergedGatePassed",
      "kind": "invariant",
      "says": "When the factory merges, CI's gate passed on the commit it merged.",
      "sha256": "sha256:50298b03a54a6477a520c5e69d5f00143e79df3f0f97c9e11a809f47beff7e89"
    },
    {
      "name": "MergedCurrentHead",
      "kind": "invariant",
      "says": "When the factory merges, the commit it merged is the pull request's current head.",
      "sha256": "sha256:c0e18793d17540760d7081d0201de32f7f3766a82e064613599e4aa88ee1c64e"
    },
    {
      "name": "MergedOneProject",
      "kind": "invariant",
      "says": "When the factory merges, the pull request changes only its one project.",
      "sha256": "sha256:21a83dfeda7606659eddade066d3c21b3af143458d87a1c425dc87fd3182ed67"
    },
    {
      "name": "MergedLockRatified",
      "kind": "invariant",
      "says": "When the factory merges, the project's lock is exactly the ratified proposal.",
      "sha256": "sha256:423e4e80eb0d0c0d54d5827b051ef28b3811054b5fe580c70731fe6eeb04f8ef"
    },
    {
      "name": "StopLimit",
      "kind": "invariant",
      "says": "At most two builds of an issue stop partway before a writer says retry.",
      "sha256": "sha256:eefc48a346f94c4c71ac2ed1c1b98d6d7b6348680047b7474a46af1e7de0558e"
    },
    {
      "name": "StoppedHasNoPullRequest",
      "kind": "invariant",
      "says": "When a build stops, or the factory refuses to start one, there is no pull request.",
      "sha256": "sha256:7181be45875df8f30e772072af4a426e20bd3f179d3894d409864519a2dc7c46"
    },
    {
      "name": "BuildStartsClean",
      "kind": "invariant",
      "says": "When a ratified proposal waits for its build, nothing is left of an earlier pull request: no head, CI result, lock, scope or merge.",
      "sha256": "sha256:440198691feedfc480aa9a981d45144a5b98b977e87b2a3a9b9dff09a92b8d66"
    },
    {
      "name": "RebuildsOwnFailures",
      "kind": "invariant",
      "says": "A retry retires a pull request to build its ratified proposal again only after the build failed its own gate in the factory's run, never after CI's gate failed or the pull request couldn't merge.",
      "sha256": "sha256:215d1af1c0c45137f17505077f54903911d7f3db7c74fbf25a4ddf268b7d4191"
    },
    {
      "name": "QuestionsAsked",
      "kind": "witness",
      "says": "The factory can ask questions.",
      "sha256": "sha256:1adfe0964c0c7b18e37d78c490e26e6040036c8af405f0c2a601f22621338e71"
    },
    {
      "name": "GotStuck",
      "kind": "witness",
      "says": "The factory can get stuck.",
      "sha256": "sha256:5f231a2c4975253ba07381d687137dcc63c3da6db14478068458b8bf1c337f67"
    },
    {
      "name": "FoundUnsupported",
      "kind": "witness",
      "says": "The factory can find an issue unsupported.",
      "sha256": "sha256:b78346b198d44eb9cccfa768b4c3185c566c70b622c1652150cebdc12c1027eb"
    },
    {
      "name": "PullRequestFailed",
      "kind": "witness",
      "says": "A pull request can fail CI's gate.",
      "sha256": "sha256:1743b153e13eaa60c8ac0c6ff3d0094b23871d71cf5afa41007dc9b531fb5155"
    },
    {
      "name": "OthersClosed",
      "kind": "witness",
      "says": "Someone else can close the pull request.",
      "sha256": "sha256:798e5eff277701c2cc8959d37a8b781d96b080fe16f8a07f580a97642d737c95"
    },
    {
      "name": "OthersMerged",
      "kind": "witness",
      "says": "Someone else can merge the pull request.",
      "sha256": "sha256:c0a472dff91cdc603bd9c8f6b809814fbfe2687bcac6784f653a18f87fcf3f40"
    },
    {
      "name": "FactoryMerges",
      "kind": "witness",
      "says": "The factory can merge its pull request.",
      "sha256": "sha256:b2b6899909ca1918cdc814903791cccf95779a14de8a1730290a82a728ce33e9"
    },
    {
      "name": "AmendmentMerges",
      "kind": "witness",
      "says": "The factory can merge an amendment to an existing lock.",
      "sha256": "sha256:1636cbb592bfbe1483435fd9025d1a9bc6a32a99cf36cf14fea8a16a83bef4c8"
    },
    {
      "name": "BuildStopped",
      "kind": "witness",
      "says": "A build can stop before it makes a pull request, and the factory posts that it failed.",
      "sha256": "sha256:83e1c86d16ba971d04e2f40d29209acfb18d2e805f8206cd5ff1e84fdda7a9e3"
    },
    {
      "name": "BuildRefusedAtLimit",
      "kind": "witness",
      "says": "After two builds of an issue stop partway, the factory can refuse to start a third and post that the build failed.",
      "sha256": "sha256:cdaab345046482a65d3e7176a4cdb9dfdceb749f9a3f4ea637d875fd7b9a0c89"
    },
    {
      "name": "OwnGateFailed",
      "kind": "witness",
      "says": "When the code fails the gate in the factory's own run, the factory can open a draft pull request and post that the build failed.",
      "sha256": "sha256:92234d240b42ae4d6e64af6ba588b757303157d959731fdee72f5ea5ce5c9b8a"
    },
    {
      "name": "CannotMerge",
      "kind": "witness",
      "says": "A pull request that passed CI's gate but changes more than its one project or has a lock other than the ratified proposal can fail.",
      "sha256": "sha256:ebf58d856eb1bde5999e609cb62a702123d63ebad711c7ad830b0b85fd56cb11"
    },
    {
      "name": "RebuiltAndMerged",
      "kind": "witness",
      "says": "A writer's retry can build a build that failed its own gate again, and the factory can merge the new build's pull request.",
      "sha256": "sha256:cd5c302d15b841db2e4e20c6c2dfed3ccda74e855e96abe29117c4678ffe3f52"
    },
    {
      "name": "RebuiltAndStopped",
      "kind": "witness",
      "says": "After a retry builds a failed build again, the new build can stop before it makes a pull request, and the factory posts that it failed.",
      "sha256": "sha256:29abd130ea8e102ce047fe4b0218aaf13472a705c44d5da50c1991da74ff7c70"
    },
    {
      "name": "RebuiltFailedAgain",
      "kind": "witness",
      "says": "The new build can fail its own gate again and leave another draft pull request, for another retry.",
      "sha256": "sha256:32882d58096b91982c49abde4f956b15d1e6c724da3136fcce392fe90dae07d2"
    },
    {
      "name": "ObeyAnyone",
      "kind": "bug",
      "says": "A bot or someone without write access gets the factory to take the issue.",
      "expect": "OnlyDirectorsDirect",
      "sha256": "sha256:2df76ef0ad424dd26babb0d819117da2f26dcb1bb2249656de7151649646c6e4"
    },
    {
      "name": "RatifyEarlier",
      "kind": "bug",
      "says": "A ratify naming an earlier proposal's hash is accepted.",
      "expect": "RatifiesCurrentProposal",
      "sha256": "sha256:e4f00b1645d32413b2185dd815789214d636019c1a0b484d4cbd209110d8851a"
    },
    {
      "name": "RatifyOverMovedLock",
      "kind": "bug",
      "says": "An amendment is ratified after the base branch's lock has moved.",
      "expect": "AmendsHeldLock",
      "sha256": "sha256:3dcf9082bf41443e9cc0847936f56d1c47de8ded2ce3f369db18dc8ae2e1f12d"
    },
    {
      "name": "MergeOnAnyPass",
      "kind": "bug",
      "says": "The factory merges a commit that passed CI even though it is no longer the pull request's head.",
      "expect": "MergedCurrentHead",
      "sha256": "sha256:3a128daece701d61560278a1cad2d2c578c01a15f4c1993f1bec595f680a078b"
    },
    {
      "name": "MergeIgnoringLock",
      "kind": "bug",
      "says": "The factory merges without checking that the project's lock is the ratified proposal.",
      "expect": "MergedLockRatified",
      "sha256": "sha256:0b31e7bb8c13599934e77582091ff43ef164a51f9af57e692cd35cab884d3a1c"
    },
    {
      "name": "StartPastLimit",
      "kind": "bug",
      "says": "The factory starts a third build after two builds of the issue have stopped partway and no writer has said retry.",
      "expect": "StopLimit",
      "sha256": "sha256:de6a2ce18ca743b573f3850951700e4930f9aa3b3b1301ad89ac25359eb5e5fc"
    },
    {
      "name": "MergeFailedBuild",
      "kind": "bug",
      "says": "The factory merges a pull request whose build failed, before a writer says retry and CI's gate passes.",
      "expect": "MergedGatePassed",
      "sha256": "sha256:7fa5ad2bae7f3e00f2fa38145f8a4a2d5f6b2155b5760e2fa2c7e90df6cd39b5"
    },
    {
      "name": "RebuildKeepsDraft",
      "kind": "bug",
      "says": "A retry builds a failed build again but keeps its draft's head, CI's result and lock for the next build.",
      "expect": "BuildStartsClean",
      "sha256": "sha256:5801d3d0e919fec59bcc76d45e4cf016fa926b18c1bfb192c6ea072de961bdae"
    },
    {
      "name": "RebuildAfterCI",
      "kind": "bug",
      "says": "A retry builds a pull request that failed CI's gate again, instead of watching it again.",
      "expect": "RebuildsOwnFailures",
      "sha256": "sha256:7a14b85e19f0ec087988ecc972410e4611a019f10b0fc68deaa3cf885f068ea6"
    }
  ]
}
