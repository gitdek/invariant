
  gate-macos:
    # A part of this repository builds only on macOS, as its contract,
    # .invariant/repository.json, declares, and Linux skips the files only
    # macOS builds. This job builds, vets and tests that part, and runs its
    # other declared checks, on a hosted macOS runner, with the gate pinned
    # to the same commit. Require it beside invariant/gate.
    name: invariant/gate-macos
    # GitHub's hosted macOS 26 image on Apple silicon, arm64. It was image
    # 20261102.0473.1 when this template was written: macOS 26.7.2, with
    # Xcode 26.6 and the macOS 26.5 SDK by default. GitHub updates the image
    # under its label, so the job prints the image it ran on.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      # Invariant is public, so CI checks it out without a key.
      - uses: actions/checkout@v7
        with:
          repository: gitdek/invariant
          ref: {{REF}}
          path: .invariant-gate
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: .invariant-gate/go.mod
          cache: false

      - name: Build the gate
        run: |
          go build -C .invariant-gate -o "$RUNNER_TEMP/invariant" ./cmd/invariant
          rm -rf .invariant-gate

      # The Go the parts are checked with: the Go of the image invariant/gate
      # checks Go parts in, so both jobs check a part with the same Go.
      - uses: actions/setup-go@v7
        with:
          go-version: '{{GO}}'
          cache: false

      # The checks are the contract's on the base, so a pull request can't
      # change what it's checked by. No token reaches this step.
      - name: Check the parts that build on macOS
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          "$RUNNER_TEMP/invariant" check-macos -base "$BASE" HEAD
