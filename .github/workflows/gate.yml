name: gate

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its run that's still going. Every
# push to main has a group of its own, so it runs to the end, and each
# commit on main gets its gate and its receipts (D-0083).
concurrency:
  group: gate-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actions: read lets a push to main ask whether a pull request's gate passed
# on its tree (#874).
permissions:
  actions: read
  contents: read
  issues: read

# Tests run git with blank global and system config, so a commit would start
# git's maintenance detached, writing into a test's repository while its
# temporary directory is being removed. Git reads this config from the
# environment even then. The plumbing sandbox sets the same (#687).
env:
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: maintenance.auto
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: gc.auto
  GIT_CONFIG_VALUE_1: "0"

jobs:
  # Whether the change touches anything the gate checks. Docs and decisions
  # don't, so the gate is skipped for them (D-0079). GitHub counts a job its
  # condition skips as passing, and waits forever for a required check whose
  # workflow a path filter skipped, so the skip lives here (D-0080). Docs cite
  # decisions, though, so this job checks the decision graph on every change,
  # and the docs' own length and links.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gated: ${{ steps.diff.outputs.gated }}
      python: ${{ steps.diff.outputs.python }}
      tlaps: ${{ steps.diff.outputs.tlaps }}
      tree: ${{ steps.tree.outputs.tree }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tree this run checks: a pull request merged into its base, or the
      # commit pushed. A pull request's gate records it when it passes, below.
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      # A push to main whose tree a pull request's gate passed on holds
      # exactly the files that gate checked, so the checks and tests don't
      # run again. Every project is still verified, since the dashboard reads
      # its receipts from this run, and invariant/gate still reports (#874).
      # A pull request merged after main moved has a tree no gate has seen,
      # and so has a direct push: they run everything. If this step fails,
      # so does the job, and then everything runs.
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: .github/gated-tree.sh "$TREE" | tee -a "$GITHUB_OUTPUT"

      # A factory pull request always runs the gate, since the factory merges
      # only on a gate that passed, and so does a push this can't compare.
      # Without renames, moving code into docs/ lists the code it removes. A
      # pull request, or a push to main, runs each opt-in real suite its
      # change can affect, and all of them when this can't compare (#416,
      # #436).
      - id: diff
        env:
          FACTORY: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'invariant/') }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          gated=true
          real=$'python=true\ntlaps=true'
          if git rev-parse -q --verify "$BASE^{commit}" > /dev/null; then
            # A failed diff fails this job, and then the gate runs.
            files=$(git diff --no-renames --name-only "$BASE...HEAD")
            if [ "$FACTORY" != "true" ]; then
              gated=false
              while IFS= read -r f; do
                case "$f" in
                  *.md|docs/*|decisions/*) ;;
                  *) gated=true ;;
                esac
              done <<< "$files"
            fi
            real=$(.github/real-suites.sh <<< "$files")
          fi
          echo "gated=$gated" >> "$GITHUB_OUTPUT"
          echo "$real" >> "$GITHUB_OUTPUT"
          echo "The gate runs: $gated"
          echo "The real suites that run: ${real//$'\n'/, }"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Every decision the docs, the SPEC and the code cite exists, the SPEC
      # rests on none that's superseded, decisions/log.md is the journal's
      # view, and the journal only grew. If this fails, the job fails, so the
      # gate runs and fails on the same check (D-0096).
      - name: Check the decision graph
        env:
          # On a pull request, the base the test merge was made from, its first
          # parent: main as the job fetches it may have gained decisions since
          # (#159). On a push, the commit before it.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          base=""
          if git rev-parse -q --verify "$BASE^{commit}" > /dev/null; then base="-base $BASE"; fi
          go run ./cmd/invariant decisions check $base

      # The README stays a front page, and every relative link in it and
      # under docs/ resolves (D-0294). The gate skips a change to docs alone,
      # so this job checks them on every change, as it does the decisions.
      - name: Check the docs
        run: go test ./internal/docs/

  verify:
    # Everything but verifying the projects, which their own jobs do, and the
    # gate's own tests. invariant/gate, below, is the check the factory
    # merges on, and it needs this.
    name: invariant/verify
    needs: changes
    # Skipped only when the step above says the change is docs alone, or that
    # a pull request's gate passed on this push's tree (#874). If that step
    # fails, the gate runs.
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.gated == 'false' || needs.changes.outputs.tested == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The oldest Python Invariant supports, which ubuntu-latest gave this
      # job until it moved to Ubuntu 26.04 and Python 3.14 (#478). With
      # invariant/python's 3.13, CI tests two versions; 3.14 is #479.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Vet and unit tests
        run: |
          go vet ./...
          # internal/verify's and internal/plumbing's tests take most of the
          # time, so they run in shards of their own, in invariant/verify-tests
          # (#345, #570). The rest get the unit-test command's 20 minutes, not
          # go test's ten (#557).
          go test -timeout 20m $(go list ./... | grep -v -e '/internal/verify$' -e '/internal/plumbing$')

      - name: Build the gate
        run: go build -o "$RUNNER_TEMP/invariant" ./cmd/invariant

      - name: Check the decision graph
        env:
          # On a pull request, the base the test merge was made from, its first
          # parent: main as the job fetches it may have gained decisions since
          # (#159). On a push, the commit before it.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          base=""
          if git rev-parse -q --verify "$BASE^{commit}" > /dev/null; then base="-base $BASE"; fi
          "$RUNNER_TEMP/invariant" decisions check $base

      # The branch names the issue: invariant/issue-<n>-<slug>. Only that
      # issue's ratification may amend an existing project (D-0045).
      - name: Keep a factory pull request in scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'invariant/')
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          issue=$(printf '%s' "$HEAD_REF" | sed -n 's#^invariant/issue-\([0-9][0-9]*\)-.*#\1#p')
          "$RUNNER_TEMP/invariant" scope -base "origin/$BASE" -issue "${issue:-0}" HEAD

      - name: Check who ratified each project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          projects=$(git ls-files '*/.invariant/invariant.json' | sed 's#/.invariant/invariant.json$##')
          plans=$(git ls-files '.invariant/plans/*.json')
          "$RUNNER_TEMP/invariant" ratification -repo "$GITHUB_REPOSITORY" $projects $plans

  verify-tests:
    # internal/verify's own tests, which took about eight minutes of
    # invariant/verify, in shards on runners of their own. Every test runs in
    # exactly one shard, and a new one lands in a shard by itself (#345).
    name: invariant/verify-tests ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.gated == 'false' || needs.changes.outputs.tested == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # As in invariant/verify, above: Python 3.12 (#478).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: internal/verify's and internal/plumbing's tests, shard ${{ matrix.shard }}
        run: .github/shard-tests.sh "${{ matrix.shard }}" -timeout 20m -- ./internal/verify/ ./internal/plumbing/

  projects:
    # Every project in the repository, found rather than listed, so a factory
    # pull request is gated without touching this file. A factory pull
    # request changes one project and nothing else, as invariant/verify's
    # scope check makes sure, so it verifies that project alone (D-0079).
    name: Find the projects
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.gated == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A factory pull request that adds its issue's ratified plan builds
      # plumbing, not a project (D-0105). It gets the whole gate, as a
      # person's pull request does, since it can change the gate itself.
      - name: What the factory built
        id: kind
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'invariant/')
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only --no-renames "origin/$BASE...HEAD" | grep -Eq '^\.invariant/plans/issue-[0-9]+\.json$'; then
            echo "plumbing=true" >> "$GITHUB_OUTPUT"
            echo "It builds a ratified plan."
          else
            echo "It builds a project."
          fi

      # Each project is a directory and a name, its last element, which names
      # its receipts. Their order is only how a run lists them: GitHub starts
      # waiting jobs in no order a workflow sets. Listed first, the slowest
      # project started last of eighteen (#852).
      - name: Find the projects
        id: find
        env:
          BASE: ${{ github.base_ref }}
          FACTORY: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'invariant/') && steps.kind.outputs.plumbing != 'true' }}
        run: |
          manifests=$(git ls-files '*/.invariant/invariant.json')
          if [ "$FACTORY" = "true" ]; then
            manifests=$(git diff --name-only "origin/$BASE...HEAD" | while read -r f; do
              d=$(dirname "$f")
              while [ "$d" != "." ]; do
                if [ -f "$d/.invariant/invariant.json" ]; then echo "$d/.invariant/invariant.json"; break; fi
                d=$(dirname "$d")
              done
            done | sort -u)
            if [ -z "$manifests" ]; then echo "The pull request changes no project."; exit 1; fi
          fi
          projects=$(printf '%s\n' $manifests | sed 's#/.invariant/invariant.json$##' | sort -r |
            jq -Rnc '[inputs | select(length > 0) | {dir: ., name: (split("/") | last)}]')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "$projects" | jq -r '.[].dir'

  project:
    # Each project's gate on a runner of its own, so verifying takes as long
    # as the slowest project rather than their sum, and a new project adds
    # no time to it (D-0155). factory/protocol, the slowest, takes 14 to 22
    # minutes, and the rest 1 to 9.
    name: ${{ matrix.project.dir }}
    needs: projects
    if: ${{ !cancelled() && needs.projects.result == 'success' && needs.projects.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.projects.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the gate
        run: go build -o "$RUNNER_TEMP/invariant" ./cmd/invariant

      - name: Verify ${{ matrix.project.dir }}
        env:
          DIR: ${{ matrix.project.dir }}
          NAME: ${{ matrix.project.name }}
        run: |
          "$RUNNER_TEMP/invariant" verify -out "out/$NAME" "$DIR"

      - name: Upload its receipt and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-${{ matrix.project.name }}
          path: out
          if-no-files-found: ignore

  receipts:
    # Every project's receipt and traces, gathered into the one artifact the
    # dashboard reads, laid out as <project>/receipt.json and
    # <project>/traces/, as when one job verified them all.
    name: Gather the receipts
    needs: project
    if: ${{ !cancelled() && needs.project.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: project-*
          merge-multiple: true
          path: out

      - name: Publish the receipt
        run: |
          if [ -f out/02-twophase-commit/receipt.md ]; then
            cat out/02-twophase-commit/receipt.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the receipts and traces
        uses: actions/upload-artifact@v7
        with:
          name: receipts
          path: out
          if-no-files-found: ignore

  integration:
    # The gate's own tests, on a pull request that can change the gate and on
    # main, on a runner of their own, so they run alongside the projects'
    # verification instead of after it. Main runs them again because two
    # pull requests that passed apart can break it together, and branches
    # needn't be up to date to merge (#436). A factory pull request can't
    # change the gate (D-0079). They run in shards, and only the tests the
    # integration tag adds, since invariant/verify and its tests' shards run
    # the rest (#345).
    name: invariant/integration ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.gated == 'false' || needs.changes.outputs.tested == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A factory pull request that adds its issue's ratified plan builds
      # plumbing, which can change the gate itself (D-0105).
      - name: What the factory built
        id: kind
        if: startsWith(github.head_ref, 'invariant/')
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only --no-renames "origin/$BASE...HEAD" | grep -Eq '^\.invariant/plans/issue-[0-9]+\.json$'; then
            echo "plumbing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show the gate rejects gaming, and synthesis can't touch the lock
        if: ${{ !startsWith(github.head_ref, 'invariant/') || steps.kind.outputs.plumbing == 'true' }}
        run: .github/shard-tests.sh "${{ matrix.shard }}" -tag integration -count=1 -timeout 20m -- ./internal/verify/ ./internal/synth/ ./internal/formalize/ ./internal/conformance/ ./internal/plumbing/

  python:
    # The collector runs in the pinned Python image, so the Python tests run
    # again, beside invariant/verify's run under the runner's python3, under
    # that image's minor version, toolchain.PythonVersion. With
    # INVARIANT_PYTHON_PINNED set, a test fails if python3 doesn't match it,
    # so a new image digest can't leave this job behind (#332). They run in
    # shards, as internal/verify's tests do (#345).
    name: invariant/python ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.gated == 'false' || needs.changes.outputs.tested == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Python tests under the pinned image's Python, shard ${{ matrix.shard }}
        env:
          INVARIANT_PYTHON_PINNED: '1'
        run: .github/shard-tests.sh "${{ matrix.shard }}" -run Python -count=1 -timeout 25m -- ./internal/verify/ ./internal/verify/pythongate/ ./internal/project/ ./cmd/invariant/

  python-latest:
    # The same Python tests under the newest Python Invariant supports, 3.14
    # (#479), beside invariant/verify's 3.12 and invariant/python's pinned
    # 3.13, so CI tests every supported version.
    name: invariant/python-latest ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.gated == 'false' || needs.changes.outputs.tested == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Python tests under Python 3.14, shard ${{ matrix.shard }}
        run: .github/shard-tests.sh "${{ matrix.shard }}" -run Python -count=1 -timeout 25m -- ./internal/verify/ ./internal/verify/pythongate/ ./internal/project/ ./cmd/invariant/

  real-python:
    # The Python tests again, with every opt-in for real Docker, TLC, Nagini
    # and wheels set, which a person used to run by hand before merging a
    # change that could affect them (#416). The application's own commands
    # run on Linux Docker since #399. As with the gate's own tests, a pull
    # request and a push to main run them when the change can affect them
    # and the gate runs at all (#436). They run in shards, as
    # internal/verify's tests do (#345).
    name: invariant/real-python ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.gated == 'false' || needs.changes.outputs.tested == 'true' || needs.changes.outputs.python != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Python tests with real Docker, TLC, Nagini and wheels, shard ${{ matrix.shard }}
        env:
          INVARIANT_PYTHON_PINNED: '1'
          INVARIANT_PYTHON_APPLICATION_EXECUTION_REAL: '1'
          INVARIANT_PYTHON_APPLICATION_GATE_REAL: '1'
          INVARIANT_PYTHON_APPLICATION_PROOF_REAL: '1'
          INVARIANT_PYTHON_APPLICATION_REAL: '1'
          INVARIANT_PYTHON_DEPS_REAL: '1'
        run: .github/shard-tests.sh "${{ matrix.shard }}" -run 'Python|Declared' -count=1 -timeout 50m -- ./internal/verify/ ./internal/conformance/ ./cmd/invariant/

  real-tlaps:
    # The pinned tlapm's own tests: its known bug and unsoundnesses, a missing
    # proof, a changed invariant and a model the gate must refuse (#360). The
    # project job proves the example itself; these show the gate fails where
    # it must. Run as real-python is (#416).
    name: invariant/real-tlaps
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.gated == 'false' || needs.changes.outputs.tested == 'true' || needs.changes.outputs.tlaps != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: TLAPS with the pinned tlapm
        env:
          INVARIANT_TLAPS_REAL: '1'
          # The soundness test reads tlapm's tests through GitHub's API, whose
          # unauthenticated limit shared runners use up (#491).
          GITHUB_TOKEN: ${{ github.token }}
        run: go test ./internal/verify -run '^TestTLAPSReal' -count=1 -timeout 30m

  gate:
    # The check the factory merges its pull requests on (D-0004, D-0033). It
    # passes when the checks, every shard of the tests, every project's
    # verification and the gathering of their receipts did, and the gate's
    # own tests and the opt-in real suites did or had nothing to run. A
    # matrix job's result is success only when every shard's was. Skipped
    # only when the change is docs alone.
    name: invariant/gate
    needs: [changes, verify, verify-tests, python, python-latest, projects, project, receipts, integration, real-python, real-tlaps]
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.gated == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verification and the gate's own tests
        env:
          VERIFY: ${{ needs.verify.result }}
          VERIFY_TESTS: ${{ needs.verify-tests.result }}
          PYTHON: ${{ needs.python.result }}
          PYTHON_LATEST: ${{ needs.python-latest.result }}
          PROJECTS: ${{ needs.projects.result }}
          FOUND: ${{ needs.projects.outputs.projects }}
          PROJECT: ${{ needs.project.result }}
          RECEIPTS: ${{ needs.receipts.result }}
          INTEGRATION: ${{ needs.integration.result }}
          REAL_PYTHON: ${{ needs.real-python.result }}
          REAL_TLAPS: ${{ needs.real-tlaps.result }}
          TESTED: ${{ needs.changes.outputs.tested }}
        run: |
          echo "Checks: $VERIFY. internal/verify's tests: $VERIFY_TESTS. Python tests under the pinned image's Python: $PYTHON. Under Python 3.14: $PYTHON_LATEST. Finding the projects: $PROJECTS. Verifying them: $PROJECT. Their receipts: $RECEIPTS. The gate's own tests: $INTEGRATION. Real Python: $REAL_PYTHON. Real TLAPS: $REAL_TLAPS."
          # On a push whose tree a pull request's gate passed on, the checks
          # and tests don't run again (#874). If they ran all the same,
          # because the first job failed, they must have passed.
          if [ "$TESTED" = true ]; then
            echo "A pull request's gate passed on this tree, so the checks and tests didn't run again."
            for result in "$VERIFY" "$VERIFY_TESTS" "$PYTHON" "$PYTHON_LATEST"; do
              [ "$result" = skipped ] || [ "$result" = success ] || exit 1
            done
          else
            [ "$VERIFY" = success ] && [ "$VERIFY_TESTS" = success ] && [ "$PYTHON" = success ] && [ "$PYTHON_LATEST" = success ] || exit 1
          fi
          [ "$PROJECTS" = success ] || exit 1
          # A repository with no projects has nothing to verify or gather.
          if [ "$FOUND" != "[]" ]; then [ "$PROJECT" = success ] && [ "$RECEIPTS" = success ] || exit 1; fi
          [ "$INTEGRATION" = success ] || [ "$INTEGRATION" = skipped ] || exit 1
          [ "$REAL_PYTHON" = success ] || [ "$REAL_PYTHON" = skipped ] || exit 1
          [ "$REAL_TLAPS" = success ] || [ "$REAL_TLAPS" = skipped ]

      # What this gate passed on, for the push to main that lands it: the
      # first job there asks for this artifact by the tree's name (#874). If
      # the upload fails, that push runs everything.
      - name: Record the tree the gate passed on
        if: github.event_name == 'pull_request' && needs.changes.outputs.tree != ''
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: mkdir gated && printf '%s\n' "$TREE" > gated/tree

      - name: Upload the record
        if: github.event_name == 'pull_request' && needs.changes.outputs.tree != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gated-${{ needs.changes.outputs.tree }}
          path: gated
          retention-days: 7
          overwrite: true
