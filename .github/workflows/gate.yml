name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # The required status check the auto-merge policy keys on (D-0004).
    name: invariant/gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and unit tests
        run: |
          go vet ./...
          go test ./...

      - name: Verify the two-phase commit example
        run: go run ./cmd/invariant verify -out out/02-twophase-commit examples/02-twophase-commit

      - name: Verify the factory-synthesized two-phase commit
        run: go run ./cmd/invariant verify examples/02-twophase-commit-synthesized

      - name: Test the TypeScript and Python implementations against the model
        run: |
          go run ./cmd/invariant verify examples/02-twophase-commit-ts
          go run ./cmd/invariant verify examples/02-twophase-commit-py

      - name: Prove the Python core with Nagini
        run: go run ./cmd/invariant verify examples/02-twophase-commit-py-proved

      - name: Publish the receipt
        if: always()
        run: |
          if [ -f out/02-twophase-commit/receipt.md ]; then
            cat out/02-twophase-commit/receipt.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the receipt and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: receipt-02-twophase-commit
          path: out/02-twophase-commit
          if-no-files-found: ignore

      - name: Show the gate rejects gaming, and synthesis can't touch the lock
        run: go test -tags integration -count=1 -timeout 20m ./internal/verify/ ./internal/synth/
