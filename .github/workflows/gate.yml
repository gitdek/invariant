name: gate

on:
  push:
    branches: [main]
    # Docs and decisions don't change what the gate checks (D-0079).
    paths-ignore: ['**.md', 'docs/**', 'decisions/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'decisions/**']

# A newer push to the same branch replaces a run that's still going.
concurrency:
  group: gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  gate:
    # The check the factory merges its pull requests on (D-0004, D-0033).
    name: invariant/gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and unit tests
        run: |
          go vet ./...
          go test ./...

      - name: Build the gate
        run: go build -o "$RUNNER_TEMP/invariant" ./cmd/invariant

      # The branch names the issue: invariant/issue-<n>-<slug>. Only that
      # issue's ratification may amend an existing project (D-0045).
      - name: Keep a factory pull request in scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'invariant/')
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          issue=$(printf '%s' "$HEAD_REF" | sed -n 's#^invariant/issue-\([0-9][0-9]*\)-.*#\1#p')
          "$RUNNER_TEMP/invariant" scope -base "origin/$BASE" -issue "${issue:-0}" HEAD

      # Every project in the repository, found rather than listed, so a
      # factory pull request is gated without touching this file. A factory
      # pull request changes one project and nothing else, as the step above
      # checks, so it verifies that project alone (D-0079).
      - name: Verify every project
        env:
          BASE: ${{ github.base_ref }}
          FACTORY: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'invariant/') }}
        run: |
          manifests=$(git ls-files '*/.invariant/invariant.json')
          if [ "$FACTORY" = "true" ]; then
            manifests=$(git diff --name-only "origin/$BASE...HEAD" | while read -r f; do
              d=$(dirname "$f")
              while [ "$d" != "." ]; do
                if [ -f "$d/.invariant/invariant.json" ]; then echo "$d/.invariant/invariant.json"; break; fi
                d=$(dirname "$d")
              done
            done | sort -u)
            if [ -z "$manifests" ]; then echo "The pull request changes no project."; exit 1; fi
          fi
          status=0
          for manifest in $manifests; do
            project="${manifest%/.invariant/invariant.json}"
            echo "::group::$project"
            "$RUNNER_TEMP/invariant" verify -out "out/$(basename "$project")" "$project" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Check who ratified each project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          projects=$(git ls-files '*/.invariant/invariant.json' | sed 's#/.invariant/invariant.json$##')
          "$RUNNER_TEMP/invariant" ratification -repo "$GITHUB_REPOSITORY" $projects

      - name: Publish the receipt
        if: always()
        run: |
          if [ -f out/02-twophase-commit/receipt.md ]; then
            cat out/02-twophase-commit/receipt.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the receipts and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: receipts
          path: out
          if-no-files-found: ignore

      # The gate's own tests, on a pull request that can change the gate. A
      # factory pull request can't, and main gets only what a pull request
      # already ran them on (D-0079).
      - name: Show the gate rejects gaming, and synthesis can't touch the lock
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'invariant/')
        run: go test -tags integration -count=1 -timeout 20m ./internal/verify/ ./internal/synth/ ./internal/formalize/
