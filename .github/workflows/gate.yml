name: gate

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its run that's still going. Every
# push to main has a group of its own, so it runs to the end, and each
# commit on main gets its gate and its receipts (D-0083).
concurrency:
  group: gate-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read

jobs:
  # Whether the change touches anything the gate checks. Docs and decisions
  # don't, so the gate is skipped for them (D-0079). GitHub counts a job its
  # condition skips as passing, and waits forever for a required check whose
  # workflow a path filter skipped, so the skip lives here (D-0080). Docs cite
  # decisions, though, so this job checks the decision graph on every change.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gated: ${{ steps.diff.outputs.gated }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A factory pull request always runs the gate, since the factory merges
      # only on a gate that passed, and so does a push this can't compare.
      # Without renames, moving code into docs/ lists the code it removes.
      - id: diff
        env:
          FACTORY: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'invariant/') }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          gated=true
          if [ "$FACTORY" != "true" ] && git rev-parse -q --verify "$BASE^{commit}" > /dev/null; then
            # A failed diff fails this job, and then the gate runs.
            files=$(git diff --no-renames --name-only "$BASE...HEAD")
            gated=false
            while IFS= read -r f; do
              case "$f" in
                *.md|docs/*|decisions/*) ;;
                *) gated=true ;;
              esac
            done <<< "$files"
          fi
          echo "gated=$gated" >> "$GITHUB_OUTPUT"
          echo "The gate runs: $gated"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Every decision the docs, the SPEC and the code cite exists, the SPEC
      # rests on none that's superseded, decisions/log.md is the journal's
      # view, and the journal only grew. If this fails, the job fails, so the
      # gate runs and fails on the same check (D-0096).
      - name: Check the decision graph
        env:
          # On a pull request, the base the test merge was made from, its first
          # parent: main as the job fetches it may have gained decisions since
          # (#159). On a push, the commit before it.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          base=""
          if git rev-parse -q --verify "$BASE^{commit}" > /dev/null; then base="-base $BASE"; fi
          go run ./cmd/invariant decisions check $base

  verify:
    # Everything but verifying the projects, which their own jobs do, and the
    # gate's own tests. invariant/gate, below, is the check the factory
    # merges on, and it needs this.
    name: invariant/verify
    needs: changes
    # Skipped only when the step above says the change is docs alone. If that
    # step fails, the gate runs.
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.gated == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and unit tests
        run: |
          go vet ./...
          # internal/verify alone takes nearly ten minutes, go test's default.
          go test -timeout 20m ./...

      - name: Build the gate
        run: go build -o "$RUNNER_TEMP/invariant" ./cmd/invariant

      - name: Check the decision graph
        env:
          # On a pull request, the base the test merge was made from, its first
          # parent: main as the job fetches it may have gained decisions since
          # (#159). On a push, the commit before it.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          base=""
          if git rev-parse -q --verify "$BASE^{commit}" > /dev/null; then base="-base $BASE"; fi
          "$RUNNER_TEMP/invariant" decisions check $base

      # The branch names the issue: invariant/issue-<n>-<slug>. Only that
      # issue's ratification may amend an existing project (D-0045).
      - name: Keep a factory pull request in scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'invariant/')
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          issue=$(printf '%s' "$HEAD_REF" | sed -n 's#^invariant/issue-\([0-9][0-9]*\)-.*#\1#p')
          "$RUNNER_TEMP/invariant" scope -base "origin/$BASE" -issue "${issue:-0}" HEAD

      - name: Check who ratified each project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          projects=$(git ls-files '*/.invariant/invariant.json' | sed 's#/.invariant/invariant.json$##')
          plans=$(git ls-files '.invariant/plans/*.json')
          "$RUNNER_TEMP/invariant" ratification -repo "$GITHUB_REPOSITORY" $projects $plans

  projects:
    # Every project in the repository, found rather than listed, so a factory
    # pull request is gated without touching this file. A factory pull
    # request changes one project and nothing else, as invariant/verify's
    # scope check makes sure, so it verifies that project alone (D-0079).
    name: Find the projects
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.gated == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A factory pull request that adds its issue's ratified plan builds
      # plumbing, not a project (D-0105). It gets the whole gate, as a
      # person's pull request does, since it can change the gate itself.
      - name: What the factory built
        id: kind
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'invariant/')
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only --no-renames "origin/$BASE...HEAD" | grep -Eq '^\.invariant/plans/issue-[0-9]+\.json$'; then
            echo "plumbing=true" >> "$GITHUB_OUTPUT"
            echo "It builds a ratified plan."
          else
            echo "It builds a project."
          fi

      # Each project is a directory and a name, its last element, which names
      # its receipts. The factory's own projects, the heaviest, come first, so
      # they start first when GitHub has fewer runners free than projects.
      - name: Find the projects
        id: find
        env:
          BASE: ${{ github.base_ref }}
          FACTORY: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'invariant/') && steps.kind.outputs.plumbing != 'true' }}
        run: |
          manifests=$(git ls-files '*/.invariant/invariant.json')
          if [ "$FACTORY" = "true" ]; then
            manifests=$(git diff --name-only "origin/$BASE...HEAD" | while read -r f; do
              d=$(dirname "$f")
              while [ "$d" != "." ]; do
                if [ -f "$d/.invariant/invariant.json" ]; then echo "$d/.invariant/invariant.json"; break; fi
                d=$(dirname "$d")
              done
            done | sort -u)
            if [ -z "$manifests" ]; then echo "The pull request changes no project."; exit 1; fi
          fi
          projects=$(printf '%s\n' $manifests | sed 's#/.invariant/invariant.json$##' | sort -r |
            jq -Rnc '[inputs | select(length > 0) | {dir: ., name: (split("/") | last)}]')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "$projects" | jq -r '.[].dir'

  project:
    # Each project's gate on a runner of its own, so verifying takes as long
    # as the slowest project rather than their sum, and a new project adds
    # no time to it (D-0155). factory/protocol, the slowest, takes about
    # 10 minutes, and the rest 1 to 4.
    name: ${{ matrix.project.dir }}
    needs: projects
    if: ${{ !cancelled() && needs.projects.result == 'success' && needs.projects.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.projects.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the gate
        run: go build -o "$RUNNER_TEMP/invariant" ./cmd/invariant

      - name: Verify ${{ matrix.project.dir }}
        env:
          DIR: ${{ matrix.project.dir }}
          NAME: ${{ matrix.project.name }}
        run: |
          "$RUNNER_TEMP/invariant" verify -out "out/$NAME" "$DIR"

      - name: Upload its receipt and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-${{ matrix.project.name }}
          path: out
          if-no-files-found: ignore

  receipts:
    # Every project's receipt and traces, gathered into the one artifact the
    # dashboard reads, laid out as <project>/receipt.json and
    # <project>/traces/, as when one job verified them all.
    name: Gather the receipts
    needs: project
    if: ${{ !cancelled() && needs.project.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: project-*
          merge-multiple: true
          path: out

      - name: Publish the receipt
        run: |
          if [ -f out/02-twophase-commit/receipt.md ]; then
            cat out/02-twophase-commit/receipt.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the receipts and traces
        uses: actions/upload-artifact@v7
        with:
          name: receipts
          path: out
          if-no-files-found: ignore

  integration:
    # The gate's own tests, on a pull request that can change the gate, on a
    # runner of their own, so they run alongside the projects' verification
    # instead of after it. A factory pull request can't change the gate, and
    # main gets only what a pull request already ran them on (D-0079).
    name: invariant/integration
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !(needs.changes.result == 'success' && needs.changes.outputs.gated == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A factory pull request that adds its issue's ratified plan builds
      # plumbing, which can change the gate itself (D-0105).
      - name: What the factory built
        id: kind
        if: startsWith(github.head_ref, 'invariant/')
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only --no-renames "origin/$BASE...HEAD" | grep -Eq '^\.invariant/plans/issue-[0-9]+\.json$'; then
            echo "plumbing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show the gate rejects gaming, and synthesis can't touch the lock
        if: ${{ !startsWith(github.head_ref, 'invariant/') || steps.kind.outputs.plumbing == 'true' }}
        run: go test -tags integration -count=1 -timeout 20m ./internal/verify/ ./internal/synth/ ./internal/formalize/ ./internal/conformance/ ./internal/plumbing/

  python:
    # The collector runs in the pinned Python image, so the Python tests run
    # again, beside invariant/verify's run under the runner's python3, under
    # that image's minor version, toolchain.PythonVersion. With
    # INVARIANT_PYTHON_PINNED set, a test fails if python3 doesn't match it,
    # so a new image digest can't leave this job behind (#332).
    name: invariant/python
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.gated == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Python tests under the pinned image's Python
        env:
          INVARIANT_PYTHON_PINNED: '1'
        run: go test -count=1 -timeout 25m -run Python ./internal/verify/ ./internal/project/ ./cmd/invariant/

  gate:
    # The check the factory merges its pull requests on (D-0004, D-0033). It
    # passes when the checks, every project's verification and the gathering
    # of their receipts did, and the gate's own tests did or had nothing to
    # run. Skipped only when the change is docs alone.
    name: invariant/gate
    needs: [changes, verify, python, projects, project, receipts, integration]
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.gated == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verification and the gate's own tests
        env:
          VERIFY: ${{ needs.verify.result }}
          PYTHON: ${{ needs.python.result }}
          PROJECTS: ${{ needs.projects.result }}
          FOUND: ${{ needs.projects.outputs.projects }}
          PROJECT: ${{ needs.project.result }}
          RECEIPTS: ${{ needs.receipts.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "Checks: $VERIFY. Python tests under the pinned image's Python: $PYTHON. Finding the projects: $PROJECTS. Verifying them: $PROJECT. Their receipts: $RECEIPTS. The gate's own tests: $INTEGRATION."
          [ "$VERIFY" = success ] && [ "$PYTHON" = success ] && [ "$PROJECTS" = success ] || exit 1
          # A repository with no projects has nothing to verify or gather.
          if [ "$FOUND" != "[]" ]; then [ "$PROJECT" = success ] && [ "$RECEIPTS" = success ] || exit 1; fi
          [ "$INTEGRATION" = success ] || [ "$INTEGRATION" = skipped ]
