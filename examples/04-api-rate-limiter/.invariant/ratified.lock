{
  "ratified": {
    "by": "gitdek",
    "at": "2026-09-26T18:05:57Z",
    "issue": 5,
    "comment": "https://github.com/gitdek/invariant/issues/5#issuecomment-5848586100",
    "proposal": "sha256:93f4926d456289ed75a82508a8229a25073126be0f819a3a5c8b8b9476a495a6",
    "amends": "sha256:645f2d6b79c8dff534328c7bc16b1d7f03fce1024e031acf87a8bdd213125dd1",
    "previous": "#3"
  },
  "bounds": {
    "Apis": "{a1, a2}",
    "Capacity": "2",
    "MaxCalls": "5",
    "MaxTime": "3",
    "MaxWaiting": "2"
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "The system starts in Init, and every step is a Next step.",
      "sha256": "sha256:873345f5b720f08aff6fee7320b9effc04fd740b1686cad148ba3c1e983d740b"
    },
    {
      "name": "TypeOK",
      "kind": "invariant",
      "says": "Each API's bucket always holds between zero and its capacity in tokens, and every call is tracked with when it was made and when it went out or was refused.",
      "sha256": "sha256:c913279019f92371b57d65a83237f12544cb5b5e93b5d6ee726e96a61f49fbe8"
    },
    {
      "name": "WithinRate",
      "kind": "invariant",
      "says": "Over any stretch of time, an API never receives more calls than its bucket's capacity plus one per refill period in that stretch.",
      "sha256": "sha256:56bbce074ebf9c76267bec029136cd99c56bdc0510261b8058141c9278b1749d"
    },
    {
      "name": "FirstInFirstOut",
      "kind": "invariant",
      "says": "Calls to an API wait and go out in exactly the order they were made.",
      "sha256": "sha256:3f05224aaae0a31804339be1d1f51f0c65a3e2fb2c41ae21c6849032f730deaa"
    },
    {
      "name": "NoNeedlessWait",
      "kind": "invariant",
      "says": "A call only waits while its API's bucket has no tokens left.",
      "sha256": "sha256:816d3735c06127b177168348d8ee6ea218400153136c7e32a2f929dbad40c8cf"
    },
    {
      "name": "NoCallLost",
      "kind": "invariant",
      "says": "Every call that was made has gone out, is still waiting, or was refused.",
      "sha256": "sha256:0c8d0ccf077c372bdaccb51edd8c531b3dbcf82dfa840c4c3470c15e5e6c48e7"
    },
    {
      "name": "BoundedWait",
      "kind": "invariant",
      "says": "No more than MaxWaiting calls are ever waiting for the same API.",
      "sha256": "sha256:d1d69cb98d0aead6feae3e009ae5b620c082820b46bb96d737236f52a04a3ed3"
    },
    {
      "name": "NoNeedlessRefusal",
      "kind": "invariant",
      "says": "A call is only refused when its API's bucket was empty and MaxWaiting calls were already waiting for that API.",
      "sha256": "sha256:cbadff9e47ad59cfdc4881d37dac125658f6313273937c30cc6ab6632e025a5c"
    },
    {
      "name": "BurstGoesOut",
      "kind": "witness",
      "says": "A full bucket's worth of calls can go out immediately at the start.",
      "sha256": "sha256:6fb0ea1097d9f2f01f204502eebf08dfd75eee6b8e65b84566f5129ce555c5b8"
    },
    {
      "name": "CallWaits",
      "kind": "witness",
      "says": "A call can have to wait for a token.",
      "sha256": "sha256:21ec83ab123fa8a4405bf176d04f166b7a0066c1ad7a3ae95085684d7343afdd"
    },
    {
      "name": "WaitingCallGoesOut",
      "kind": "witness",
      "says": "A call that waited can go out once a token refills.",
      "sha256": "sha256:3593f395de2afcb3355dcb94fcca23845e93675ebfff52e3dbb21ac1d764527c"
    },
    {
      "name": "BucketRefills",
      "kind": "witness",
      "says": "A bucket that was spent from can refill back to full.",
      "sha256": "sha256:4cdd36e9b9cb5b508885950594d9a9e71c07b342628d61974b439f77c06cb3ec"
    },
    {
      "name": "CallRefused",
      "kind": "witness",
      "says": "A call can be refused because too many calls are already waiting.",
      "sha256": "sha256:51d6e515dd4ce110a48f7b2ff62b9d833bc52d166e9d0176925764dbe4689035"
    },
    {
      "name": "SendWithoutToken",
      "kind": "bug",
      "says": "A call goes out even though its API's bucket is empty.",
      "expect": "WithinRate",
      "sha256": "sha256:135ca5d517c000e30fe0d08422a32ba53d28c89866049f1275df1becafcc5440"
    },
    {
      "name": "JumpQueue",
      "kind": "bug",
      "says": "A refilled token goes to the newest waiting call instead of the oldest.",
      "expect": "FirstInFirstOut",
      "sha256": "sha256:2dda7982ec48ad5bd9bab46b20fdebcce998ff9e00a2bcb42a418e135a850211"
    },
    {
      "name": "QueuePastLimit",
      "kind": "bug",
      "says": "A call is put in the queue even though MaxWaiting calls are already waiting.",
      "expect": "BoundedWait",
      "sha256": "sha256:2c55c763550b344bacbf3e065dd3181459589ab52a2ce8727eaded248ec66c80"
    },
    {
      "name": "RefuseEarly",
      "kind": "bug",
      "says": "A call is refused while there is still room in its API's queue.",
      "expect": "NoNeedlessRefusal",
      "sha256": "sha256:2d7c5a41e7eb7374dfd038e6bd29c8233473564cc352c64bb61285f189d3d887"
    }
  ]
}
