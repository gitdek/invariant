{
  "ratified": {
    "by": "gitdek",
    "at": "2026-09-27T11:48:34Z",
    "issue": 18,
    "comment": "https://github.com/gitdek/invariant/issues/18#issuecomment-5855556473",
    "proposal": "sha256:d336f2a0bc892a749695abf1ecb77d3855395089db356caa8e9f066a82ba5a45"
  },
  "bounds": {
    "Clients": "{c1, c2, c3}",
    "Size": "2"
  },
  "statements": [
    {
      "name": "Spec",
      "kind": "spec",
      "says": "The pool starts with no connections out, and every step is a client taking a free connection, being refused when none is free, or giving back one it holds.",
      "sha256": "sha256:888644f77d1137ceac2004ff642ab403a65e17129dd866037f9c2133414ec565"
    },
    {
      "name": "NeverOverSize",
      "kind": "invariant",
      "says": "The pool never has more connections out than its size.",
      "sha256": "sha256:42d2eb3334dfc4023730666f4d0fee4717a1a5c4cc4fdb0a3e7a64fa9ea02a22"
    },
    {
      "name": "AtMostOnePerClient",
      "kind": "invariant",
      "says": "A client never holds more than one connection at a time.",
      "sha256": "sha256:7e054b7c98d0943e8eb2e8371a8d7290bb700583d028663dfeff84e1d5212a70"
    },
    {
      "name": "NoSharedConnection",
      "kind": "invariant",
      "says": "No connection is ever held by two clients at once.",
      "sha256": "sha256:b0a6f38f4b673e8024cd82ac0cafcfb32748714ebd477420427f0d01eca81326"
    },
    {
      "name": "TypeOK",
      "kind": "invariant",
      "says": "Each client always holds some set of the pool's connections.",
      "sha256": "sha256:6524f9e1a905e58474243505c26d62eb3a1a45f86f1887d08330adf82898168b"
    },
    {
      "name": "PoolFull",
      "kind": "witness",
      "says": "The pool can reach a state where every connection is out.",
      "sha256": "sha256:8a8ae28b23fae73c52857ed12bfd8dc788cb7f426b2918fae2824942a8704430"
    },
    {
      "name": "SomeoneHolds",
      "kind": "witness",
      "says": "A client can get a connection.",
      "sha256": "sha256:f49abb4cae63a3cf2de02cf999b4583370faa7b8aac5c09815c1c89a7ab879a2"
    },
    {
      "name": "AcquireWhenFull",
      "kind": "bug",
      "says": "When every connection is out, the pool hands a client one that is already out.",
      "expect": "NeverOverSize",
      "sha256": "sha256:fccca70e301304d5765c7984883f9450ead39930fbd98691b0f4e52ea3c6cf46"
    },
    {
      "name": "AcquireTwice",
      "kind": "bug",
      "says": "A client that already holds a connection is given a second one.",
      "expect": "AtMostOnePerClient",
      "sha256": "sha256:4d92f1b87e7ce7af5055640eaed1861de4b2ffcd12ffad320f2b6777e351e0a1"
    }
  ]
}
