<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; width: 1280px; height: 640px; overflow: hidden; position: relative;
         background: radial-gradient(1200px 640px at 30% 40%, #141a21 0%, #0E1116 60%);
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
  .ring { position: absolute; border-radius: 50%; border: 1.5px solid #E6EDF3; pointer-events: none; }
  img { width: 720px; position: relative; }
  h1 { position: relative; margin: 46px 0 12px; color: #E6EDF3; font-size: 40px; font-weight: 600; letter-spacing: -0.01em; }
  p { position: relative; margin: 0; color: #8B949E; font-size: 24px; }
</style></head><body>
  <img id="logo" src="logo-dark.svg" alt="Invariant">
  <h1>A code factory that doesn’t guess.</h1>
  <p>Ratified decisions in. Verified pull requests out.</p>
  <script>
    // Faint orbits radiating from the mark's fixed point (viewBox 0 12.5 319.5 57.5; centre 27.5, 41.5).
    window.addEventListener('load', () => {
      const r = document.getElementById('logo').getBoundingClientRect(), k = r.width / 319.5;
      const cx = r.left + 27.5 * k, cy = r.top + (41.5 - 12.5) * k;
      [150, 250, 370, 510, 670].forEach((rad, i) => {
        const d = document.createElement('div'); d.className = 'ring';
        Object.assign(d.style, { width: 2*rad+'px', height: 2*rad+'px', left: cx-rad+'px', top: cy-rad+'px', opacity: (0.075 - i*0.012).toFixed(3) });
        document.body.insertBefore(d, document.body.firstChild);
      });
    });
  </script>
</body></html>
