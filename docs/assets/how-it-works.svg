<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 164" width="880" height="164" role="img" aria-label="Invariant's loop: an issue is formalized, people ratify the statements, Invariant synthesizes code and a model, the gate finds a counterexample, the code is repaired, every check passes, and it merges.">
