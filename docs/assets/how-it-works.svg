<text x="440" y="150" font-size="13.5" fill="#1F2328" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0917;0.2083" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/>Invariant drafts the statements and surfaces the forks.</text>
<text x="440" y="150" font-size="13.5" fill="#0B7A58" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2083;0.3750" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/>People ratify what must be true.</text>
