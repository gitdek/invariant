<text x="506" y="122" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_1)"><tspan fill="#8B949E">// tells the transaction manager.</tspan></text>
<text x="506" y="140" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_2)"><tspan fill="#8B949E">// @ </tspan><tspan fill="#FF7B72">requires</tspan><tspan fill="#38D9A9"> 0 &lt;= r &amp;&amp; r &lt; N</tspan></text>
<text x="506" y="158" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_3)"><tspan fill="#8B949E">// @ </tspan><tspan fill="#FF7B72">requires</tspan><tspan fill="#38D9A9"> s.RM[r] == Working</tspan></text>
<text x="506" y="176" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_4)"><tspan fill="#8B949E">// @ </tspan><tspan fill="#FF7B72">ensures</tspan><tspan fill="#38D9A9"> t.RM[r] == Prepared &amp;&amp; t.PreparedMsg[r]</tspan></text>
<text x="506" y="194" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_5)"><tspan fill="#8B949E">// @ </tspan><tspan fill="#FF7B72">ensures</tspan><tspan fill="#38D9A9"> forall i int :: 0 &lt;= i &amp;&amp; i &lt; N &amp;&amp; i != r ==&gt; t.RM[i] == s.RM[i] &amp;&amp; t.PreparedMsg[i] == s.PreparedMsg[i]</tspan></text>
<text x="506" y="212" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_6)"><tspan fill="#8B949E">// @ </tspan><tspan fill="#FF7B72">ensures</tspan><tspan fill="#38D9A9"> t.TM == s.TM &amp;&amp; t.TMPrepared == s.TMPrepared</tspan></text>
<text x="506" y="230" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_7)"><tspan fill="#8B949E">// @ </tspan><tspan fill="#FF7B72">ensures</tspan><tspan fill="#38D9A9"> t.CommitMsg == s.CommitMsg &amp;&amp; t.AbortMsg == s.AbortMsg</tspan></text>
<text x="506" y="248" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_8)"><tspan fill="#FF7B72">func</tspan><tspan fill="#E6EDF3"> RMPrepare(s </tspan><tspan fill="#FFA657">State</tspan><tspan fill="#E6EDF3">, r </tspan><tspan fill="#FFA657">int</tspan><tspan fill="#E6EDF3">) (t </tspan><tspan fill="#FFA657">State</tspan><tspan fill="#E6EDF3">) {</tspan></text>
<text x="506" y="266" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_9)"><tspan fill="#E6EDF3">    t = s</tspan></text>
<text x="506" y="284" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_10)"><tspan fill="#E6EDF3">    t.RM[r] = Prepared</tspan></text>
<text x="506" y="302" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_11)"><tspan fill="#E6EDF3">    t.PreparedMsg[r] = </tspan><tspan fill="#79C0FF">true</tspan></text>
<text x="506" y="320" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_12)"><tspan fill="#E6EDF3">    </tspan><tspan fill="#FF7B72">return</tspan><tspan fill="#E6EDF3"> t</tspan></text>
<text x="506" y="338" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" clip-path="url(#type1_13)"><tspan fill="#E6EDF3">}</tspan></text>
